<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Campus Pulse logo: a graduation cap over a heartbeat line.
       Browser-tab version: rounded corners, bolder lines for small sizes. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2233"/>
      <stop offset="1" stop-color="#05080d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7df0ff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#134e5e"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <g transform="translate(256 262) scale(1.14) translate(-256 -262)">
    <!-- cap: the band under the board -->
    <path d="M162 214 L162 268 C162 296 206 316 256 316 C306 316 350 296 350 268 L350 214 L256 256 Z" fill="url(#band)"/>
    <!-- cap: the board -->
    <path d="M256 112 L432 188 L256 264 L80 188 Z" fill="url(#cap)"/>
    <!-- tassel -->
    <path d="M256 188 L392 206 L392 276" fill="none" stroke="#f8fafc" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="392" cy="285" r="14" fill="#f8fafc"/>
    <!-- the pulse -->
    <path d="M92 384 H186 L214 346 L246 424 L284 322 L314 384 H420" fill="none"
          stroke="#f8fafc" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
